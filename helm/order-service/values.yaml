replicaCount: 1

image:
  repository: 943378954775.dkr.ecr.us-east-2.amazonaws.com/nimbus-retail/order-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3004

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

kafka:
  brokers: "nimbus-kafka-kafka-bootstrap.nimbus-prod.svc.cluster.local:9092"

cartServiceUrl: "http://cart-service.nimbus-prod.svc.cluster.local:3003"

logLevel: info
